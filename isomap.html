<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCMesh — 4K Isometric Base Studio</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --panel-border: #1f293d;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --sun: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #000;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #334155;
      border-color: var(--accent);
    }
    .btn-4k {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-4k:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }
    .layout {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #111a2e 0%, #060912 100%);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay-hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .hud-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hud-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .preset-pills {
      display: flex;
      gap: 4px;
    }
    .pill {
      padding: 3px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      background: #1e293b;
    }
    .pill.active {
      background: var(--sun);
      color: #000;
      font-weight: 700;
    }
    input[type="range"] {
      width: 160px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .cam-hint {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      pointer-events: none;
    }
    .info-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: #cbd5e1;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo-badge">ISO 4K</span>
      <div>
        <div class="title" id="page-title">Zero-Lag 4K Isometric Base Renderer</div>
        <div class="subtitle">Headless Raytraced Ambient Occlusion • Chunk CAS Blobs</div>
      </div>
    </div>
    <div class="actions">
      <button id="btn-ao" class="pill active">AO: On</button>
      <button id="btn-1080">📸 1080p</button>
      <button id="btn-4k" class="btn-4k">✨ Export 4K (3840×2160)</button>
    </div>
  </header>

  <div class="layout">
    <div id="viewport-container">
      <canvas id="viewport"></canvas>
      <div class="cam-hint">🖱️ Drag: Pan • Wheel: Zoom</div>
      <div class="info-badge" id="info-badge">Time: Midday / Noon • Sun: 75°</div>

      <div class="overlay-hud">
        <div class="hud-group">
          <div class="hud-title">
            <span>Time of Day</span>
            <span id="time-text">12:00</span>
          </div>
          <div class="preset-pills">
            <button class="pill" data-time="0">🌅 Dawn</button>
            <button class="pill active" data-time="6000">☀️ Noon</button>
            <button class="pill" data-time="12000">🌇 Sunset</button>
            <button class="pill" data-time="18000">🌙 Night</button>
          </div>
        </div>

        <div class="hud-group">
          <div class="hud-title">Sun Elevation (<span id="sun-val">75°</span>)</div>
          <input type="range" id="sun-slider" min="0" max="90" value="75" />
        </div>

        <div class="hud-group">
          <div class="hud-title">Sun Azimuth (<span id="az-val">180°</span>)</div>
          <input type="range" id="az-slider" min="0" max="360" value="180" />
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('viewport');
    const ctx = canvas.getContext('2d');

    const worldId = window.location.pathname.split('/').pop() || 'main';
    let isoData = null;
    let timeOfDay = 6000;
    let customAz = 180;
    let customEl = 75;
    let aoEnabled = true;

    // View state
    let zoom = 14;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let lastMouseX = 0, lastMouseY = 0;

    // Color Palette
    const paletteColors = [
      [90, 160, 60],   // 0: grass
      [125, 125, 125], // 1: stone
      [134, 96, 67],   // 2: dirt
      [45, 95, 185],   // 3: water
      [218, 208, 155], // 4: sand
      [182, 142, 88],  // 5: oak planks
      [105, 105, 105], // 6: cobblestone
      [220, 240, 255], // 7: glass
      [255, 190, 60],  // 8: lantern
      [95, 100, 105],  // 9: andesite casing
    ];

    async function loadData() {
      try {
        const res = await fetch(`/v1/worlds/${worldId}/isomap?radius=3&time_of_day=${timeOfDay}&sun_angle=${customAz}&ao=${aoEnabled}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        isoData = await res.json();
        document.getElementById('info-badge').textContent = `Time: ${isoData.sun.time_name} • Sun: ${Math.round(isoData.sun.elevation)}°`;
        render();
      } catch (e) {
        console.error('Failed to load isomap data:', e);
      }
    }

    function resize() {
      if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        panX = canvas.width / 2;
        panY = canvas.height / 2;
        render();
      }
    }
    window.addEventListener('resize', resize);

    // Isometric Projection Math
    function projectIso(x, y, z, cx, cz) {
      const wx = cx * 16 + x;
      const wz = cz * 16 + z;
      const isoX = (wx - wz) * zoom * Math.cos(Math.PI / 6);
      const isoY = (wx + wz) * zoom * Math.sin(Math.PI / 6) - (y - 60) * (zoom * 0.9);
      return [isoX + panX, isoY + panY];
    }

    function render(targetCtx = ctx, w = canvas.width, h = canvas.height, renderZoom = zoom, ox = panX, oy = panY) {
      targetCtx.fillStyle = '#060912';
      targetCtx.fillRect(0, 0, w, h);

      if (!isoData) return;

      const sun = isoData.sun;
      const light = sun.light_color;
      const amb = sun.ambient_color;

      // Collect all voxels and sort by depth (isometric Painter's Algorithm: wx + wz)
      const allVoxels = [];
      for (const ch of isoData.chunks || []) {
        for (const vox of ch.voxels || []) {
          const rx = vox[0], y = vox[1], rz = vox[2];
          const wx = ch.cx * 16 + rx, wz = ch.cz * 16 + rz;
          const depth = (wx + wz) * 1000 + y;
          allVoxels.push({ wx, y, wz, p_idx: vox[3], ao: vox[4], depth });
        }
      }
      allVoxels.sort((a, b) => a.depth - b.depth);

      // Render isometric cube diamonds
      const cos30 = Math.cos(Math.PI / 6);
      const sin30 = Math.sin(Math.PI / 6);
      const hw = renderZoom * cos30;
      const hh = renderZoom * sin30;
      const dy = renderZoom * 0.9;

      for (const v of allVoxels) {
        const px = (v.wx - v.wz) * hw + ox;
        const py = (v.wx + v.wz) * hh - (v.y - 60) * dy + oy;

        // Base color
        const base = paletteColors[v.p_idx] || [120, 120, 120];

        // Ambient occlusion factor (0: deeply shaded, 3: unoccluded)
        const aoFactor = aoEnabled ? (0.45 + (v.ao / 3.0) * 0.55) : 1.0;

        // Top Face (Lit by sun directly)
        const topR = Math.min(255, Math.floor(base[0] * (amb[0] + light[0] * 0.85) * aoFactor));
        const topG = Math.min(255, Math.floor(base[1] * (amb[1] + light[1] * 0.85) * aoFactor));
        const topB = Math.min(255, Math.floor(base[2] * (amb[2] + light[2] * 0.85) * aoFactor));

        targetCtx.fillStyle = `rgb(${topR},${topG},${topB})`;
        targetCtx.beginPath();
        targetCtx.moveTo(px, py - hh);
        targetCtx.lineTo(px + hw, py);
        targetCtx.lineTo(px, py + hh);
        targetCtx.lineTo(px - hw, py);
        targetCtx.closePath();
        targetCtx.fill();

        // Right Face
        const rR = Math.min(255, Math.floor(base[0] * (amb[0] + light[0] * 0.5) * aoFactor));
        const rG = Math.min(255, Math.floor(base[1] * (amb[1] + light[1] * 0.5) * aoFactor));
        const rB = Math.min(255, Math.floor(base[2] * (amb[2] + light[2] * 0.5) * aoFactor));

        targetCtx.fillStyle = `rgb(${rR},${rG},${rB})`;
        targetCtx.beginPath();
        targetCtx.moveTo(px + hw, py);
        targetCtx.lineTo(px, py + hh);
        targetCtx.lineTo(px, py + hh + dy);
        targetCtx.lineTo(px + hw, py + dy);
        targetCtx.closePath();
        targetCtx.fill();

        // Left Face (Shaded side)
        const lR = Math.min(255, Math.floor(base[0] * (amb[0] + light[0] * 0.3) * aoFactor));
        const lG = Math.min(255, Math.floor(base[1] * (amb[1] + light[1] * 0.3) * aoFactor));
        const lB = Math.min(255, Math.floor(base[2] * (amb[2] + light[2] * 0.3) * aoFactor));

        targetCtx.fillStyle = `rgb(${lR},${lG},${lB})`;
        targetCtx.beginPath();
        targetCtx.moveTo(px - hw, py);
        targetCtx.lineTo(px, py + hh);
        targetCtx.lineTo(px, py + hh + dy);
        targetCtx.lineTo(px - hw, py + dy);
        targetCtx.closePath();
        targetCtx.fill();
      }
    }

    // Export 4K Wallpaper
    function exportWallpaper(width, height, nameSuffix) {
      const offscreen = document.createElement('canvas');
      offscreen.width = width;
      offscreen.height = height;
      const offCtx = offscreen.getContext('2d');

      const scale = width / 1200;
      const exportZoom = zoom * scale;
      const ox = width / 2;
      const oy = height / 2;

      render(offCtx, width, height, exportZoom, ox, oy);

      const link = document.createElement('a');
      link.download = `${worldId}_isometric_${nameSuffix}.png`;
      link.href = offscreen.toDataURL('image/png');
      link.click();
    }

    document.getElementById('btn-4k').onclick = () => exportWallpaper(3840, 2160, '4K');
    document.getElementById('btn-1080').onclick = () => exportWallpaper(1920, 1080, '1080p');

    // Pan & Zoom
    canvas.onmousedown = e => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    };
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      panX += e.clientX - lastMouseX;
      panY += e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      render();
    });
    canvas.addEventListener('wheel', e => {
      zoom = Math.max(4, Math.min(40, zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
      render();
    });

    // Time presets
    document.querySelectorAll('.preset-pills button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.preset-pills button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        timeOfDay = parseInt(b.dataset.time);
        loadData();
      };
    });

    // AO toggle
    const btnAo = document.getElementById('btn-ao');
    btnAo.onclick = () => {
      aoEnabled = !aoEnabled;
      btnAo.textContent = aoEnabled ? 'AO: On' : 'AO: Off';
      btnAo.classList.toggle('active', aoEnabled);
      loadData();
    };

    // Sliders
    const azSlider = document.getElementById('az-slider');
    azSlider.oninput = () => {
      customAz = parseInt(azSlider.value);
      document.getElementById('az-val').textContent = customAz + '°';
      loadData();
    };

    const sunSlider = document.getElementById('sun-slider');
    sunSlider.oninput = () => {
      customEl = parseInt(sunSlider.value);
      document.getElementById('sun-val').textContent = customEl + '°';
      loadData();
    };

    // Init
    resize();
    loadData();
  </script>
</body>
</html>
