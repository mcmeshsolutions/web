<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCMesh - Live FTB Quest Progression Tree</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --panel-border: #1f293d;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --locked: #475569;
      --card-bg: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #000;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }
    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }
    .subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn:hover {
      background: #334155;
      border-color: var(--accent);
    }
    .btn-active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    .sidebar {
      width: 320px;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chapter-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chapter-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chapter-card:hover {
      background: #1e293b;
      border-color: var(--accent);
    }
    .chapter-card.selected {
      background: rgba(56, 189, 248, 0.08);
      border-color: var(--accent);
    }
    .chapter-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .chapter-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
    }
    .chapter-count {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .progress-bar-bg {
      height: 6px;
      background: #0f172a;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #38bdf8);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #131b2e 0%, #090d16 100%);
      overflow: hidden;
      cursor: grab;
    }
    .canvas-container:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .tree-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      display: flex;
      gap: 16px;
      pointer-events: none;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .modal-backdrop {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      width: 520px;
      max-width: 90%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-close:hover {
      color: var(--text);
    }
    .reward-pill {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--warning);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
      margin: 3px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-badge">MCMESH</div>
      <div>
        <div class="title">Live FTB Quest Progression Tree</div>
        <div class="subtitle" id="questsSubtitle">Loading quest graph...</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" onclick="zoomIn()">+</button>
      <button class="btn" onclick="zoomOut()">-</button>
      <button class="btn" onclick="resetView()">Reset</button>
      <a class="btn" id="btnDigestLink" href="#">World Digest</a>
      <a class="btn" id="btnTimelineLink" href="#">Timeline</a>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Quest Chapters</span>
        <span id="overallProgressBadge" style="color:var(--accent); font-weight:700;">0%</span>
      </div>
      <div class="chapter-list" id="chapterListContainer">
        Loading chapters...
      </div>
    </aside>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="treeCanvas"></canvas>
      <div class="tree-overlay">
        <div class="legend-item">
          <div class="legend-dot" style="background:#10b981;"></div>
          <span>Completed</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#f59e0b;"></div>
          <span>Available</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#475569;"></div>
          <span>Locked</span>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" id="questModal" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <span style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--accent);" id="modalChapter">Chapter</span>
          <div class="modal-title" id="modalTitle">Quest Title</div>
        </div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>

      <div style="font-size:0.9rem; color:var(--text-muted); line-height:1.5;" id="modalDescription">
        Quest description details.
      </div>

      <div id="modalStatusBox" style="background:rgba(15,23,42,0.8); border:1px solid var(--panel-border); border-radius:8px; padding:12px; font-size:0.84rem;">
        Status details.
      </div>

      <div>
        <div style="font-size:0.85rem; font-weight:700; color:var(--text); margin-bottom:6px;">Rewards:</div>
        <div id="modalRewardsContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/');
    const worldId = pathParts[pathParts.length - 1] || 'default';
    document.getElementById('questsSubtitle').textContent = 'World: ' + worldId;
    document.getElementById('btnDigestLink').href = '/digest/' + worldId;
    document.getElementById('btnTimelineLink').href = '/timeline/' + worldId;

    let questData = null;
    let selectedChapterId = 'all';

    // Canvas pan & zoom state
    let zoom = 1.0;
    let panX = 40;
    let panY = 60;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');

    function resizeCanvas() {
      canvas.width = container.clientWidth * window.devicePixelRatio;
      canvas.height = container.clientHeight * window.devicePixelRatio;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    async function loadQuests() {
      try {
        const res = await fetch(`/v1/worlds/${worldId}/quests`);
        questData = await res.json();
        renderSidebar();
        resizeCanvas();
      } catch (err) {
        console.error('Failed to load quest tree:', err);
      }
    }

    function renderSidebar() {
      if (!questData || !questData.chapters) return;
      const list = document.getElementById('chapterListContainer');
      let totalQ = 0;
      let completedQ = 0;

      let html = `
        <div class="chapter-card ${selectedChapterId === 'all' ? 'selected' : ''}" onclick="selectChapter('all')">
          <div class="chapter-card-header">
            <span class="chapter-title">All Chapters</span>
            <span class="chapter-count">${questData.nodes.length} quests</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: 100%;"></div>
          </div>
        </div>
      `;

      for (const ch of questData.chapters) {
        totalQ += ch.total_quests;
        completedQ += ch.completed_quests;
        const pct = Math.round((ch.completed_quests / ch.total_quests) * 100);
        html += `
          <div class="chapter-card ${selectedChapterId === ch.id ? 'selected' : ''}" onclick="selectChapter('${ch.id}')">
            <div class="chapter-card-header">
              <span class="chapter-title">${escapeHtml(ch.title)}</span>
              <span class="chapter-count">${ch.completed_quests} / ${ch.total_quests}</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${pct}%;"></div>
            </div>
          </div>
        `;
      }

      list.innerHTML = html;
      const overallPct = totalQ > 0 ? Math.round((completedQ / totalQ) * 100) : 0;
      document.getElementById('overallProgressBadge').textContent = overallPct + '% Cleared';
    }

    function selectChapter(chId) {
      selectedChapterId = chId;
      renderSidebar();
      render();
    }

    function render() {
      if (!questData) return;
      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.translate(panX, panY);
      ctx.scale(zoom, zoom);

      const nodeMap = new Map();
      for (const node of questData.nodes) {
        nodeMap.set(node.id, node);
      }

      // Draw dependency bezier curves
      for (const node of questData.nodes) {
        if (selectedChapterId !== 'all' && node.chapter_id !== selectedChapterId) continue;
        for (const depId of node.dependencies) {
          const parent = nodeMap.get(depId);
          if (parent) {
            ctx.beginPath();
            ctx.moveTo(parent.x + 80, parent.y + 25);
            const midX = (parent.x + 80 + node.x) / 2;
            ctx.bezierCurveTo(midX, parent.y + 25, midX, node.y + 25, node.x, node.y + 25);

            if (parent.completed && node.completed) {
              ctx.strokeStyle = '#10b981';
              ctx.lineWidth = 2.5;
            } else if (parent.completed) {
              ctx.strokeStyle = '#f59e0b';
              ctx.lineWidth = 2.0;
            } else {
              ctx.strokeStyle = '#334155';
              ctx.lineWidth = 1.5;
            }
            ctx.stroke();
          }
        }
      }

      // Draw quest nodes
      for (const node of questData.nodes) {
        if (selectedChapterId !== 'all' && node.chapter_id !== selectedChapterId) continue;

        const w = 150;
        const h = 50;
        const r = 8;
        const x = node.x;
        const y = node.y;

        // Card background
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();

        // Border & Status
        if (node.completed) {
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2;
        } else {
          // Check if dependencies are met
          const unlocked = node.dependencies.every(d => {
            const p = nodeMap.get(d);
            return p && p.completed;
          });
          if (unlocked) {
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
          } else {
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
          }
        }
        ctx.stroke();

        // Node Title
        ctx.fillStyle = node.completed ? '#f1f5f9' : '#94a3b8';
        ctx.font = 'bold 12px sans-serif';
        const truncatedTitle = node.title.length > 18 ? node.title.substring(0, 16) + '...' : node.title;
        ctx.fillText(truncatedTitle, x + 12, y + 22);

        // Status pill
        ctx.font = '10px sans-serif';
        if (node.completed) {
          ctx.fillStyle = '#10b981';
          ctx.fillText('Cleared [ok]', x + 12, y + 38);
        } else {
          ctx.fillStyle = '#64748b';
          ctx.fillText(node.dependencies.length > 0 ? 'Requires: ' + node.dependencies.length : 'Root', x + 12, y + 38);
        }
      }

      ctx.restore();
    }

    function zoomIn() { zoom = Math.min(2.5, zoom * 1.2); render(); }
    function zoomOut() { zoom = Math.max(0.4, zoom / 1.2); render(); }
    function resetView() { zoom = 1.0; panX = 40; panY = 60; render(); }

    container.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartX = e.clientX - panX;
      dragStartY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        panX = e.clientX - dragStartX;
        panY = e.clientY - dragStartY;
        render();
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      zoom = Math.max(0.4, Math.min(2.5, zoom * zoomFactor));
      render();
    }, { passive: false });

    container.addEventListener('click', (e) => {
      if (!questData) return;
      const rect = container.getBoundingClientRect();
      const mx = (e.clientX - rect.left - panX) / zoom;
      const my = (e.clientY - rect.top - panY) / zoom;

      for (const node of questData.nodes) {
        if (selectedChapterId !== 'all' && node.chapter_id !== selectedChapterId) continue;
        if (mx >= node.x && mx <= node.x + 150 && my >= node.y && my <= node.y + 50) {
          openModal(node);
          break;
        }
      }
    });

    function openModal(node) {
      document.getElementById('modalTitle').textContent = node.title;
      document.getElementById('modalChapter').textContent = node.chapter_id;
      document.getElementById('modalDescription').textContent = node.description;

      const statusBox = document.getElementById('modalStatusBox');
      if (node.completed) {
        const d = new Date(node.completed_at * 1000);
        statusBox.innerHTML = `
          <div style="color:#10b981; font-weight:700;">Status: Completed</div>
          <div style="margin-top:4px; color:var(--text);">Cleared by: <strong>${escapeHtml(node.completed_by)}</strong></div>
          <div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">Completed on ${d.toLocaleString()}</div>
        `;
      } else {
        statusBox.innerHTML = `
          <div style="color:#f59e0b; font-weight:700;">Status: In Progress / Locked</div>
          <div style="margin-top:4px; color:var(--text-muted);">Prerequisite dependencies: ${node.dependencies.length > 0 ? node.dependencies.join(', ') : 'None'}</div>
        `;
      }

      const rewardsBox = document.getElementById('modalRewardsContainer');
      if (node.rewards && node.rewards.length > 0) {
        rewardsBox.innerHTML = node.rewards.map(r => `<span class="reward-pill">${escapeHtml(r)}</span>`).join('');
      } else {
        rewardsBox.innerHTML = '<span style="color:var(--text-muted); font-size:0.8rem;">No bonus rewards declared.</span>';
      }

      document.getElementById('questModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('questModal').classList.remove('open');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    loadQuests();
  </script>
</body>
</html>
